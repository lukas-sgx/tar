# This rule is not used by the project goudron itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the gdr.soigneux.works.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: goudron
    app.kubernetes.io/managed-by: kustomize
  name: microservice-editor-role
rules:
- apiGroups:
  - gdr.soigneux.works
  resources:
  - microservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gdr.soigneux.works
  resources:
  - microservices/status
  verbs:
  - get
